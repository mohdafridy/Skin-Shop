name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Generate route types
        # tsc alone can't see Next's typed-route helpers (e.g. LayoutProps)
        # until something has generated .next/types/ at least once.
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skin_shop
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          STORE_CURRENCY: inr
